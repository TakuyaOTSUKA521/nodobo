<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nodobo</title>

<!-- Local-dev-server fallback (frame-ancestors is ignored in a meta tag - the
     real enforcement, and the rest of these directives, are also sent as an
     HTTP header by vercel.json for the deployed site). script-src/style-src
     need 'unsafe-inline' because of the inline router <script type="module">
     below and per-render inline style="" attributes - everything else is
     scoped to only the origins this app actually talks to. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://sicucuywqqcapbogfkoy.supabase.co https://esm.sh; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2f7fa8">
<link rel="icon" href="./icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nodobo">
<meta name="mobile-web-app-capable" content="yes">

<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.112.4"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="root"></div>

<script type="module">
// 骨組みとルーティングのみ (MAINTENANCE.md §3)。各画面は views/、画面をまたいで
// 使う部品は components/、状態変数は state.js にある。
import { supabase } from './lib/supabase.js';
import { root, session, state, ui, cache, linesById, setSession, setRenderer, go } from './state.js';
import { renderSummerDecor, renderHeader, wireHeader } from './components/header.js';
import { toggleNodeHidden, toggleDisplayEditing } from './components/maskToggle.js';
import { toggleNodeExpanded } from './components/collapsibleTree.js';
import { captureLineDraft } from './components/recordForm.js';
import { renderLoginPage, wireLogin } from './views/login.js';
import { renderDashboardPage, wireDashboard } from './views/dashboard.js';
import { fetchTxPage, renderTxListPage, wireTxList } from './views/transactions.js';
import { renderNodesPage, wireNodesPage } from './views/nodes.js';
import { renderDetailPage, wireDetailPage } from './views/nodeDetail.js';
import { renderAnalysisPage, wireAnalysisPage } from './views/composition.js';
import { renderSettingsPage, wireSettingsPage } from './views/settings.js';
import { managerOpen, openManager, renderManagerModal, wireManagerModal } from './views/manager.js';
import { openRecordSheet, openEditSheet, prepareSheet, renderSheet, wireSheet } from './views/recordSheet.js';

// A toggle chip's state, or undefined when the chip isn't on screen (so the
// form falls back to the saved value instead of a stale false).
function chipDraft(id) {
  const el = document.getElementById(id);
  return el ? el.getAttribute('aria-pressed') === 'true' : undefined;
}

// Snapshots the record sheet / manager forms still in the DOM before render()
// replaces it, so any re-render (tree ▸, 🙈, opening ノード管理 over the sheet,
// ...) keeps what the user typed. The manager form is skipped when a handler
// flagged it to start fresh.
function captureFormDrafts() {
  if (ui.sheet) ui.recordDraft = captureLineDraft() ?? ui.recordDraft;

  const nodeNameEl = document.getElementById('node-name');
  ui.managerDraft = !ui.resetManagerForm && nodeNameEl ? {
    name: nodeNameEl.value,
    parentId: document.getElementById('node-parent-select').value || null,
    nodeType: document.getElementById('node-type-select').value,
    excludeFromFlowTotals: document.getElementById('node-exclude-flow').checked,
    hidden: chipDraft('node-hidden-chip'),
    archive: chipDraft('node-archive-chip'),
  } : null;
  ui.resetManagerForm = false;
}

async function render() {
  captureFormDrafts();
  if (!session) {
    root.innerHTML = renderSummerDecor() + renderLoginPage();
    wireLogin();
    return;
  }

  let pageHtml = '';
  let wire = () => {};

  switch (state.page) {
    case 'tx':
      if (cache.txListRows.length === 0) await fetchTxPage(true);
      pageHtml = await renderTxListPage();
      wire = wireTxList;
      break;
    case 'nodes':
      pageHtml = await renderNodesPage();
      wire = wireNodesPage;
      break;
    case 'analysis':
      pageHtml = await renderAnalysisPage();
      wire = wireAnalysisPage;
      break;
    case 'detail':
      pageHtml = await renderDetailPage();
      wire = wireDetailPage;
      break;
    case 'settings':
      pageHtml = renderSettingsPage();
      wire = wireSettingsPage;
      break;
    case 'dashboard':
    default:
      pageHtml = await renderDashboardPage();
      wire = wireDashboard;
  }

  const managerHtml = managerOpen ? await renderManagerModal() : '';
  if (ui.sheet) await prepareSheet();
  // Re-rendering the same page (state not replaced by go()) keeps the scroll
  // position - e.g. after closing the sheet with a new line saved.
  const keepScroll = state === renderedState;
  const scrollY = window.scrollY;
  root.innerHTML = `${renderSummerDecor()}<div class="app-shell">${renderHeader()}<main>${pageHtml}</main><div id="sheet-host">${renderSheet()}</div>${managerHtml}</div>`;
  if (keepScroll) window.scrollTo(0, scrollY);
  renderedState = state;
  document.documentElement.classList.toggle('sheet-open', Boolean(ui.sheet));
  wireHeader();
  root.querySelectorAll('[data-node-hide-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleNodeHidden(btn.dataset.nodeHideId);
    });
  });
  root.querySelectorAll('[data-display-edit]').forEach((btn) => {
    btn.addEventListener('click', toggleDisplayEditing);
  });
  root.querySelectorAll('[data-tree-toggle-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleNodeExpanded(btn.dataset.treeToggleId);
    });
  });
  root.querySelectorAll('[data-open-manager]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      openManager(el.dataset.openManager || null);
    });
  });
  root.querySelectorAll('[data-open-record]').forEach((el) => {
    el.addEventListener('click', openRecordSheet);
  });
  await wire();
  wireSheet();
  if (managerOpen) await wireManagerModal();
}

let renderedState = null;
setRenderer(render);

// Any transaction row (data-line-id) opens the edit sheet. Delegated once on
// root so rows swapped in place (取引一覧's search/load-more) need no rewiring.
function openLineFromEvent(e) {
  const el = e.target.closest('[data-line-id]');
  if (!el || !root.contains(el)) return false;
  openEditSheet(linesById.get(el.dataset.lineId));
  return true;
}
root.addEventListener('click', openLineFromEvent);
root.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-line-id]') && openLineFromEvent(e)) e.preventDefault();
});
// 記録シートの検索結果「+ 新しいノードとして作成」(views は他の views を import しない)。
document.addEventListener('nodobo:open-manager', (e) => openManager(null, { name: e.detail?.name ?? '' }));

const { data: { session: existingSession } } = await supabase.auth.getSession();
if (existingSession) {
  setSession(existingSession);
  // ホーム画面のショートカット用: #record ならダッシュボードの上に記録シートを開いて起動する
  if (location.hash === '#record') ui.sheet = { mode: 'record' };
  go('dashboard');
} else {
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.error('SW registration failed', err));
  });
}
</script>
</body>
</html>
